services:
  - type: web
    name: wikipedia-research-bot
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn --bind 0.0.0.0:$PORT app:app
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: WIKIBOT_USER_AGENT
        sync: false
      - key: DATABASE_URL
        sync: false
